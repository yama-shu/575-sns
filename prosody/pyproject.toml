[project]
name = "prosody"
version = "0.1.0"
description = "575 の五七五判定エンジン"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.1",
    "pydantic==2.13.4",
    # 形態素解析器と辞書（ADR-0003）
    "sudachipy==0.6.11",
    "sudachidict-core==20260723",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "httpx==0.28.1",
    "hypothesis==6.165.2",
    "ruff==0.16.2",
    "mypy==2.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prosody"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# 詳細設計 04 のカバレッジ目標（prosody は C1 100%）を常時計測する
addopts = "--cov=prosody --cov-branch --cov-report=term-missing"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "TID"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# ADR-0003 の「解析器を差し替え可能にする」を静的解析で担保する。
# SudachiPy を import してよいのは prosody/sudachi.py だけ（下の per-file-ignores）。
# テストだけで守ろうとすると、後から誰かが直接 import しても気づけない。
"sudachipy".msg = "SudachiPy に依存してよいのは prosody/sudachi.py だけです。Tokenizer インターフェース越しに使ってください（ADR-0003）。"

[tool.ruff.lint.per-file-ignores]
# 解析器を隠す実装。ここだけが SudachiPy を知ってよい。
"src/prosody/sudachi.py" = ["TID251"]
# 解析器そのものを検証するテスト
"tests/test_sudachi.py" = ["TID251"]
# テスト名は日本語で「何を確かめるか」を書く。pep8-naming（N802）は
# 関数名が非 ASCII だと一律に違反と判定するため、テストに限って除外する。
# 実装コードでは N802 を有効なままにする。
"tests/**" = ["N802"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
# SudachiPy は py.typed マーカーを持たないため、型情報を提供しない。
# 解析器を差し替え可能にする設計（ADR-0003）により、依存はこの1箇所に閉じている。
module = ["sudachipy.*"]
ignore_missing_imports = true
