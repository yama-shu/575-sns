# k3d（ローカル）用。
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

resources:
  - ../../base

patches:
  - target: { kind: Ingress, name: grafana }
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: grafana.localhost

secretGenerator:
  - name: grafana-secret
    envs:
      - secret.env
