apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# namespace は overlays で与える（アプリ側と同じ理由。k8s/README.md）

resources:
  - namespace.yaml
  - prometheus-rbac.yaml
  - prometheus-config.yaml
  - prometheus.yaml
  - blackbox.yaml
  - node-exporter.yaml
  - grafana.yaml
  - ingress.yaml

commonLabels:
  app.kubernetes.io/part-of: monitoring
