# サービス間の接続先とログの設定。
#
# **秘密情報はここに入れない。** DB のパスワードは Secret に置く
# （kustomization.yaml の secretGenerator）。
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  # api
  API_PORT: "8080"
  API_PROSODY_URL: "http://prosody:8000"
  API_LOG_LEVEL: "info"
  API_DATABASE_TIMEOUT: "3s"
  API_PROSODY_TIMEOUT: "1s"
  # 本番は必ず true。HTTPS でのみ Cookie を送る
  API_SECURE_COOKIE: "true"
  API_BCRYPT_COST: "12"

  # prosody
  PROSODY_LOG_LEVEL: "info"
  PROSODY_SUDACHI_DICT: "core"
  # **ワーカーは 1 に固定する。** ワーカーごとに辞書が複製されるため、
  # 並列度は replicas で取る（ADR-0007）。
  PROSODY_WORKERS: "1"

  # web
  WEB_API_INTERNAL_URL: "http://api:8080"

  # postgres
  POSTGRES_USER: "sns575"
  POSTGRES_DB: "sns575"
