# 業務ロジックと永続化。
#
# **ブラウザからは到達しない。** Ingress は web にのみ向ける
# （基本設計 01 §6）。api は ClusterIP で web からのみ呼ばれる。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      # **api には preStop を置けない。** runtime が distroless であり
      # シェルも sleep も無い。代わりに SIGTERM を受けて Echo を
      # graceful shutdown している（cmd/api/main.go）ため、
      # 処理中の要求は取りこぼさない。
      terminationGracePeriodSeconds: 30
      # **Kubernetes が注入する環境変数を無効にする。**
      # 既定では Service 名から PROSODY_PORT=tcp://10.43.x.x:8000 のような
      # 変数が注入され、アプリ自身の同名の設定を上書きする（#91 で実際に落ちた）。
      enableServiceLinks: false
      containers:
        - name: api
          image: ghcr.io/yama-shu/575-api
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef: { name: app-config }
          env:
            - name: API_DATABASE_URL
              valueFrom:
                secretKeyRef: { name: db-secret, key: API_DATABASE_URL }
          # **readiness と liveness を分ける。** prosody が落ちても
          # 閲覧系は動くため、/readyz が false でも再起動はさせない
          # （縮退運転。NFR-02-03）。
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          # 実測 3.4 MiB（ADR-0007 §10）。
          resources:
            requests: { memory: "32Mi", cpu: "50m" }
            limits: { memory: "128Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: api
  ports:
    - port: 8080
      targetPort: http
